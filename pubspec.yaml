name: easybis_usb_serial
description: >-
  Android USB serial plugin for Flutter on usb-serial-for-android: CH34x, CP21xx, FTDI, CDC-ACM
  and Prolific PL2303 including the newer G/HXN family (e.g. PL2303GC 067b:23a3). Fork of usb_serial.
version: 0.6.0
homepage: https://github.com/Easybis/usbserial
repository: https://github.com/Easybis/usbserial
issue_tracker: https://github.com/Easybis/usbserial/issues
topics:
  - usb
  - serial
  - uart
  - android

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  async: ^2.5.0
  collection: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.easybis.usbserial
        pluginClass: UsbSerialPlugin
